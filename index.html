      ));
    }
    if (tracks.length > 0) {
      clips['idle'] = new THREE.AnimationClip('idle', 3, tracks);
    }
  }
  
  // WALK animation
  {
    const tracks = [];
    const leftLeg = findBone(['leftleg', 'left_leg', 'legup_l', 'l_leg']);
    const rightLeg = findBone(['rightleg', 'right_leg', 'legup_r', 'r_leg']);
    
    if (leftLeg) {
      tracks.push(new THREE.QuaternionKeyframeTrack(
        leftLeg.name + '.quaternion',
        [0, 0.5, 1, 1.5, 2],
        [0,0,0,1, 0.2,0,0,0.98, 0,0,0.15,1, -0.2,0,0,0.98, 0,0,0,1]
      ));
    }
    if (rightLeg) {
      tracks.push(new THREE.QuaternionKeyframeTrack(
        rightLeg.name + '.quaternion',
        [0, 0.5, 1, 1.5, 2],
        [-0.2,0,0,0.98, 0,0,-0.15,1, 0.2,0,0,0.98, 0,0,0.15,1, -0.2,0,0,0.98]
      ));
    }
    
    if (tracks.length > 0) {
      clips['walk'] = new THREE.AnimationClip('walk', 2, tracks);
    }
  }
  
  // SWING animation
  {
    const tracks = [];
    const leftArm = findBone(['leftarm', 'left_arm', 'uparm_l', 'l_arm']);
    const rightArm = findBone(['rightarm', 'right_arm', 'uparm_r', 'r_arm']);
    const spine = findBone(['spine', 'chest', 'armature']);
    
    if (leftArm) {
      tracks.push(new THREE.QuaternionKeyframeTrack(
        leftArm.name + '.quaternion',
        [0, 0.3, 0.6],
        [0,0,0,1, -0.4,-0.2,0.15,0.88, 0,0,0,1]
      ));
    }
    if (rightArm) {
      tracks.push(new THREE.QuaternionKeyframeTrack(
        rightArm.name + '.quaternion',
        [0, 0.3, 0.6],
        [0,0,0,1, 0.4,0.2,-0.15,0.88, 0,0,0,1]
      ));
    }
    if (spine) {
      tracks.push(new THREE.QuaternionKeyframeTrack(
        spine.name + '.quaternion',
        [0, 0.3, 0.6],
        [0,0,0,1, -0.08,0.15,0,0.99, 0,0,0,1]
      ));
    }
    
    if (tracks.length > 0) {
      clips['swing'] = new THREE.AnimationClip('swing', 0.6, tracks);
    }
  }
  
  // Convert clips to actions on mixer
  const actions = {};
  for (const name in clips) {
    const action = mixer.clipAction(clips[name]);
    action.clampWhenFinished = false;
    action.setLoop(THREE.LoopRepeat, Infinity);
    actions[name] = action;
  }
  
  return actions;
}

}

// Same independent-instance pattern as spawnDuelCharacter above (its own
// fresh parse, its own mixer, its own actions) — proven safe to run many of
// at once since each mixer only touches its own model. The extra bit here
// is the ID card: id/role/home, so console logs and the HUD can say exactly
// which fielder is which instead of just an anonymous list of meshes. home
// is where chase/return-throw AI (later passes) will send them back to
// between deliveries; for now it's just where they spawn and stand.
function spawnFielder(loader, spot) {
  let model = null;
  try {
    model = _cloneXbot();
  } catch (err) {
    console.error('Fielder spawn: failed to clone an extra X_Bot instance for ' + spot.id, err);
    return null;
  }
  model.scale.setScalar(MODEL_SCALE);
  model.position.set(spot.x, 0, spot.z);
  // Face roughly toward the pitch centre so they're not spawned staring
  // out at the boundary — good enough for a standing-still first pass.
  model.rotation.y = Math.atan2(-spot.x, -spot.z);
  model.traverse((node) => {
    if (node.isMesh) { node.castShadow = true; node.receiveShadow = true; }
  });
  scene.add(model);

  const mixer = new THREE.AnimationMixer(model);
  const actions = {};
  for (const name in FBX_TEST_CLIPS) {
    const action = mixer.clipAction(FBX_TEST_CLIPS[name]);
    action.clampWhenFinished = false;
    action.setLoop(THREE.LoopRepeat, Infinity);
    actions[name] = action;
  }

  // Add procedural walk animation
  {
    const bones = {};
    model.traverse((node) => {
      if (node.isBone) bones[node.name] = node;
    });
    
    function findBone(patterns) {
      if (!Array.isArray(patterns)) patterns = [patterns];
      for (const name in bones) {
        const nameLower = name.toLowerCase();
        for (const pat of patterns) {
          if (nameLower.includes(pat.toLowerCase())) return bones[name];
        }
      }
      return null;
    }
    
    const tracks = [];
    const leftLeg = findBone(['leftleg', 'left_leg', 'legup_l', 'l_leg']);
    const rightLeg = findBone(['rightleg', 'right_leg', 'legup_r', 'r_leg']);
    
    if (leftLeg) {
      tracks.push(new THREE.QuaternionKeyframeTrack(
        leftLeg.name + '.quaternion',
        [0, 0.5, 1, 1.5, 2],
        [0,0,0,1, 0.2,0,0,0.98, 0,0,0.15,1, -0.2,0,0,0.98, 0,0,0,1]
      ));
    }
    if (rightLeg) {
      tracks.push(new THREE.QuaternionKeyframeTrack(
        rightLeg.name + '.quaternion',
        [0, 0.5, 1, 1.5, 2],
        [-0.2,0,0,0.98, 0,0,-0.15,1, 0.2,0,0,0.98, 0,0,0.15,1, -0.2,0,0,0.98]
      ));
    }
    
    if (tracks.length > 0) {
      const walkClip = new THREE.AnimationClip('walk', 2, tracks);
      const walkAction = mixer.clipAction(walkClip);
      walkAction.clampWhenFinished = false;
      walkAction.setLoop(THREE.LoopRepeat, Infinity);
      actions['walk'] = walkAction;
    }
  }

  const fielder = {
    id: spot.id,
    role: spot.role,
    home: { x: spot.x, z: spot.z },
    model, mixer, actions, currentAction: null,
    // chaseState machine: 'base' (at home, idle) -> 'chasing' (sprinting to
    // the predicted landing/lead point) -> 'arrived' (reached the ball,
    // pausing to gather it) -> 'throwing' (playing throwObject, ball
    // released partway through) -> 'returned' (job done for this ball,
    // just stands there until resetDelivery sends everyone back to 'base').
    chaseState: 'base',
    pickupTimer: 0, // counts up while 'arrived', gates the FIELDER_PICKUP_DELAY pause before the throw starts
    throwTimer: 0,  // counts up while 'throwing', tracked against the throwObject clip's own duration
    thrown: false,  // true once this fielder's throw has actually released the ball, so it only fires once per throwObject playthrough
  };
  console.log('Fielder spawned: ' + fielder.id + ' (' + fielder.role + ') at ('
    + spot.x.toFixed(1) + ',' + spot.z.toFixed(1) + ').');
  return fielder;
}

// ---- Pass 2/3/4/5: reaction + chase + pickup + return throw. Same shape as
// the reference 2D fielder AI's reaction-radius trigger + predicted-
// landing-point chase, adapted to this file's single struck ball
// (DUEL.ball/ballVel) instead of a whole scoring/running game. The chase
// loop below hands off to 'arrived' -> pickup -> 'throwing' -> return-throw
// release, all in this same function; the bowler's side of the catch
// (Pass 6) lives in updateReturnThrow() right after it.
function updateFielderAI(dt) {
  if (!DUEL.ball || !DUEL.afterHit) return; // nothing to react to until a ball's actually been hit

  if (DUEL.fielderReactionTimer > 0) DUEL.fielderReactionTimer -= dt;

  // Trigger: any 'base' fielder within reaction range starts chasing once
  // the reaction delay's elapsed. More than one can still trigger on the
  // same ball while nobody's claimed it yet — there's no single designated
  // fielder up front, whoever's close enough goes for it, same as the
  // reference AI. Once someone has actually claimed the ball (arrived on
  // it — see the pickup pass below), we stop handing out new chases for it.
  if (DUEL.fielderReactionTimer <= 0 && DUEL.fielderClaim === null) {
    for (const f of FIELDERS) {
      if (f.chaseState !== 'base') continue;
      const d = Math.hypot(f.model.position.x - DUEL.ball.position.x, f.model.position.z - DUEL.ball.position.z);
      if (d <= FIELDER_REACTION_RADIUS) f.chaseState = 'chasing';
    }
  }

  for (const f of FIELDERS) {
    if (f.chaseState !== 'chasing') continue;

    // Someone else already claimed the ball while this fielder was still
    // en route (they arrived first) — stand down instead of also piling
    // onto it. Without this, a straggler can reach the ball mid-return-
    // flight, re-freeze it in their own hands, and run a second parallel
    // pickup/throw sequence on top of the first fielder's.
    if (DUEL.fielderClaim !== null && DUEL.fielderClaim !== f.id) {
      f.chaseState = 'base';
      _duelPlayAction(f, 'idle');
      continue;
    }

    // Aim at the ball's predicted landing point while it's still airborne
    // (solved from its current height/vertical speed under DUEL_GRAVITY,
    // same idea as the reference AI's projectile solve), or a short lead
    // off its current velocity once it's already rolling on the ground.
    let aimX, aimZ;
    const grounded = DUEL.ball.position.y <= DUEL_BALL_RADIUS + 0.05;
    if (!grounded && DUEL.ballVel.y < 0.05) {
      const y0 = DUEL.ball.position.y - DUEL_BALL_RADIUS;
      const vy = DUEL.ballVel.y;
      const g = DUEL_GRAVITY;
      const disc = vy * vy - 2 * g * y0;
      const t = disc > 0 ? (-vy + Math.sqrt(disc)) / g : 0.3;
      const tClamped = Math.max(0.05, Math.min(t, 3));
      aimX = DUEL.ball.position.x + DUEL.ballVel.x * tClamped;
      aimZ = DUEL.ball.position.z + DUEL.ballVel.z * tClamped;
    } else {
      const leadTime = 0.35;
      aimX = DUEL.ball.position.x + DUEL.ballVel.x * leadTime;
      aimZ = DUEL.ball.position.z + DUEL.ballVel.z * leadTime;
    }
    // Never sprint into the stands chasing a lofted aim point.
    const aimDist = Math.hypot(aimX, aimZ);
    if (aimDist > FIELDER_BOUNDARY_R) {
      const s = FIELDER_BOUNDARY_R / aimDist;
      aimX *= s; aimZ *= s;
    }

    // "Arrived" is judged against the ball's REAL current position, not the
    // lead/predicted point, so they don't stop short of a ball that curved
    // away from the prediction.
    const realDist = Math.hypot(DUEL.ball.position.x - f.model.position.x, DUEL.ball.position.z - f.model.position.z);
    if (realDist <= FIELDER_CHASE_ARRIVE_DIST) {
      // Claim the ball right here, at the moment of arrival — this is what
      // makes the "only one fielder handles it" rule actually stick. If
      // two fielders arrive on the very same frame, whichever the FIELDERS
      // loop reaches first wins the claim; the other sees fielderClaim
      // already taken next iteration (or next frame, worst case) and
      // stands down via the check above.
      DUEL.fielderClaim = f.id;
      f.chaseState = 'arrived';
      _duelPlayAction(f, 'idle');
      console.log('Fielder ' + f.id + ' reached the ball — gathering it.');
      continue;
    }

    const dx = aimX - f.model.position.x;
    const dz = aimZ - f.model.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist > 0.0001) {
      // Forward-facing convention here matches BOWLER_FACING_YAW/STRIKER_
      // FACING_YAW above: forward(yaw) = (sin(yaw), 0, cos(yaw)).
      f.model.rotation.y = Math.atan2(dx, dz);
      const step = Math.min(dist, FIELDER_CHASE_SPEED * dt);
      f.model.position.x += (dx / dist) * step;
      f.model.position.z += (dz / dist) * step;
    }
    _duelPlayAction(f, 'walk');
  }

  // ---- Pass 4: pickup. A fielder who's 'arrived' pauses briefly —
  // "gathering" the ball — before the throw animation starts. The ball is
  // treated as held by them for this whole window: DUEL.ballHeldByFielder
  // blocks the main ball-physics block in updateDuel so it doesn't keep
  // falling/rolling on its own while someone's supposedly got hold of it.
  for (const f of FIELDERS) {
    if (f.chaseState !== 'arrived') continue;
    // Defensive state-guard (second safety net): even if something upstream
    // let a non-claimant reach 'arrived' — a stale reference, an edge case
    // in the standing-down logic above — this refuses to let anyone but
    // the actual claimant touch the ball here.
    if (DUEL.fielderClaim !== f.id) { f.chaseState = 'base'; continue; }
    DUEL.ballHeldByFielder = true;
    // Snap the ball to roughly hand height at the fielder's position so it
    // visibly stays with them while they gather it, instead of sitting
    // wherever it happened to come to rest on the ground.
    DUEL.ball.position.set(f.model.position.x, 1.0, f.model.position.z);
    DUEL.ball.visible = true;
    f.pickupTimer += dt;
    if (f.pickupTimer >= FIELDER_PICKUP_DELAY) {
      f.chaseState = 'throwing';
      f.pickupTimer = 0;
      f.throwTimer = 0;
      f.thrown = false;
      // Square up to the bowler before the throw animation rips off —
      // same forward(yaw) = (sin(yaw), 0, cos(yaw)) convention used
      // everywhere else in the duel/fielder code.
      const dxB = BOWLER_END_X - f.model.position.x;
      const dzB = BOWLER_END_Z - f.model.position.z;
      f.model.rotation.y = Math.atan2(dxB, dzB);
      _duelPlayAction(f, 'throwObject');
    }
  }

  // ---- Pass 5: return throw. Same release-fraction pattern the bowler's
  // own delivery uses (see updateDuel's bowlTimer handling) — the ball
  // stays glued to the fielder's hand until partway through the throwObject
  // clip, then launches on its own analytic arc back toward the bowler's
  // end, aimed to arrive at roughly chest height for an easy collect.
  for (const f of FIELDERS) {
    if (f.chaseState !== 'throwing') continue;
    // Same defensive guard as the pickup pass — only the claimant may
    // actually launch the ball.
    if (DUEL.fielderClaim !== f.id) { f.chaseState = 'base'; continue; }
    const throwClip = f.actions.throwObject.getClip();
    f.throwTimer += dt;

    if (!f.thrown && f.throwTimer >= throwClip.duration * FIELDER_THROW_RELEASE_FRAC) {
      f.thrown = true;
      DUEL.ballHeldByFielder = false;
      DUEL.returning = true;

      // FIX: previously this launched the ball as a free projectile
      // (velocity + gravity) and relied on an analytic vy0 solve landing it
      // within BOWLER_CATCH_DIST/HEIGHT at exactly the right instant. Any
      // per-frame dt jitter, or a ground bounce redirect near arrival,
      // could make it miss that narrow window — the ball would then just
      // roll away with nothing left to re-aim it, DUEL.returning stayed
      // true, and the whole chase/pickup/throw/collect loop sat stalled
      // until the 8s watchdog force-reset (that's the "throw never reaches
      // the bowler" symptom). A return throw always goes fielder-to-bowler
      // — it doesn't need free-flight physics — so just interpolate it
      // along that path over a fixed flight time and guarantee the catch
      // at the end, same as the reference 2D fielderReleaseThrow/keeper-
      // catch, which always resolves cleanly.
      const releasePos = f.model.position.clone();
      releasePos.y = 1.6; // roughly shoulder height for a fielder's release
      const targetPos = { x: BOWLER_END_X, y: 1.1, z: BOWLER_END_Z }; // roughly chest height for the bowler to pluck out of the air
      const dist = Math.max(0.001, Math.hypot(targetPos.x - releasePos.x, targetPos.z - releasePos.z));
      const flightTime = Math.max(0.15, dist / FIELDER_THROW_PACE);

      DUEL.returnThrowStart = releasePos;
      DUEL.returnThrowTarget = targetPos;
      DUEL.returnThrowDuration = flightTime;
      DUEL.returnThrowElapsed = 0;

      DUEL.ball.position.copy(releasePos);
      DUEL.ballVel.set(0, 0, 0); // no longer driving return-throw motion, kept zeroed for consistency
      DUEL.ball.visible = true;
      console.log('Fielder ' + f.id + ' released the return throw — ' + flightTime.toFixed(2) + 's flight to the bowler.');
    } else if (!f.thrown) {
      // Still winding up — keep the ball glued to the hand.
      DUEL.ball.position.set(f.model.position.x, 1.0, f.model.position.z);
    }

    if (f.throwTimer >= throwClip.duration) {
      _duelPlayAction(f, 'idle');
      f.chaseState = 'returned'; // job done — resetDelivery sends everyone back to 'base' for the next ball
    }
  }
}

// ---- Pass 6: bowler collects. FIX: this used to simulate the returned
// ball as a free projectile (gravity + bounce) and only counted it
// "collected" if it happened to pass within BOWLER_CATCH_DIST/HEIGHT of
// the bowler at exactly the right instant — a narrow window that real
// per-frame timing/bounce jitter could miss, after which the ball just
// rolled off with nothing to bring it back (DUEL.returning stuck true,
function updateReturnThrow(dt) {
  if (!DUEL.returning) return;

  DUEL.returnThrowElapsed += dt;
  const frac = Math.min(1, DUEL.returnThrowElapsed / DUEL.returnThrowDuration);
  const start = DUEL.returnThrowStart;
  const target = DUEL.returnThrowTarget;

  DUEL.ball.position.x = start.x + (target.x - start.x) * frac;
  DUEL.ball.position.z = start.z + (target.z - start.z) * frac;
  // Straight-line height lerp plus a sine hump for a visible arc/lob —
  // purely cosmetic, doesn't feed back into the arrival check below.
  const baseY = start.y + (target.y - start.y) * frac;
  const arcHeight = Math.min(2.5, 0.6 + Math.hypot(target.x - start.x, target.z - start.z) * 0.03);
  DUEL.ball.position.y = baseY + Math.sin(frac * Math.PI) * arcHeight;

  // AUTO-CATCH: if ball reaches target or goes beyond, trigger catch
  const catchRadius = 2.0;  // acceptance radius without bowler model
  const distToTarget = Math.hypot(
    DUEL.ball.position.x - DUEL.returnThrowTarget.x,
    DUEL.ball.position.z - DUEL.returnThrowTarget.z
  );
  
  if (distToTarget <= catchRadius || frac >= 1) {
    // Ball caught — reset for next delivery
    DUEL.returning = false;
    DUEL.returnComplete = true;
    DUEL.stateTimer = 0;
    DUEL.ballVel.set(0, 0, 0);
    DUEL.ball.visible = false;  // disappear 
    console.log('Ball auto-caught — next delivery incoming.');
  }
}

// Keeps the caught ball glued to the bowler's hands through the
// Play an animation action on a character with smooth crossfading
function _duelPlayAction(char, name) {
  const next = char.actions[name];
  if (!next || char.currentAction === next) return;
  next.reset();
  next.setEffectiveWeight(1);
  next.play();
  if (char.currentAction) {
    char.currentAction.crossFadeTo(next, 0.25, true);
  } else {
    // First action this character has ever played (e.g. the very first
    // "idle" right after spawning): force the mixer to evaluate frame 0
    // of it immediately, rather than waiting for the next animate() tick.
    // Without this the model — and anything rigidly parented to one of
    // its bones, like the striker's bat — sits in the raw T-pose bind
    // position for a frame, which reads as the bat "popping" into place
    // mid-animation instead of already being held in the idle stance.
    char.mixer.update(0);
  }
  char.currentAction = next;
}

function createCricketBat() {
  const group = new THREE.Group();
  const handleMat = new THREE.MeshStandardMaterial({ color: 0x2b2b2b, roughness: 0.8 });
  const bladeMat  = new THREE.MeshStandardMaterial({ color: 0xdcc088, roughness: 0.6 });

  // grip runs from the group's origin (where the hand holds it) downward
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.017, 0.017, 0.26, 10), handleMat);
  handle.position.y = -0.13;
  group.add(handle);

  // blade continues below the handle
  const blade = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.5, 0.028), bladeMat);
  blade.position.y = -0.26 - 0.25;
  group.add(blade);
  
  // Store blade reference for collision detection
  group.blade = blade;
  group.bladeHalfHeight = 0.25;  // half of blade height (0.5 / 2)
  group.bladeHalfWidth = 0.055;  // half of blade width (0.11 / 2)

  group.traverse((n) => { if (n.isMesh) { n.castShadow = true; n.receiveShadow = true; } });
  return group;
}

// Finds the striker's right-hand bone and parents a bat to it, scale-
// compensated for the rig's 0.01 scale. Matches on "righthand" specifically
// (not "righthandthumb/index/middle/ring/pinky") so it grabs the palm bone,
// not a finger bone.
function attachBatToHand(char) {
  let handBone = null;
  char.model.traverse((node) => {
    if (handBone) return;
    const flat = node.name.toLowerCase().replace(/[^a-z]/g, '');
    if (flat.endsWith('righthand')) handBone = node;
  });

  const bat = createCricketBat();
  bat.scale.setScalar(BAT_SCALE_COMPENSATION);

  if (!handBone) {
    console.warn('Duel test: no RightHand bone found on the striker rig — bat placed near the model instead of actually held. Check the console log of bone names if this happens.');
    bat.scale.setScalar(1); // not parented under the scaled rig, so no compensation needed
    bat.position.set(char.model.position.x + 0.3, 1.0, char.model.position.z);
    scene.add(bat);
    return bat;
  }

  bat.position.copy(BAT_GRIP_LOCAL_POS).add(BAT_GRIP_CORRECTION_POS);
  bat.rotation.set(
    BAT_GRIP_LOCAL_ROT.x + BAT_GRIP_CORRECTION_ROT.x,
    BAT_GRIP_LOCAL_ROT.y + BAT_GRIP_CORRECTION_ROT.y,
    BAT_GRIP_LOCAL_ROT.z + BAT_GRIP_CORRECTION_ROT.z
  );
  handBone.add(bat);
  return bat;
}

function deliverBall() {
  // Solves the vertical launch speed analytically so the ball actually
  // pitches (touches the ground) at a "good length" spot partway down the
  // pitch, then bounces on up toward the striker — a real bowling arc
  // rather than a flat, unrealistic throw.
  const releasePos = new THREE.Vector3(BOWLER_END_X, 1.9, BOWLER_END_Z);
  // releasePos.y = 1.9; // roughly release height for an overarm action

  // Aim point: where the ball should actually cross the striker's crease.
  // Everything else — including the bounce point — is derived from this
  // one straight line, so the ball can't drift sideways after it pitches.
  // (Previously the bounce point had its own independent random jitter,
  // separate from the arrival point, so the same sideways offset applied
  // twice — once release-to-bounce, once bounce-to-striker — landing the
  // ball a meter-plus wide of where it looked aimed.)
  const arrivalX = STRIKER_END_X + (Math.random() - 0.5) * 0.6; // line variation, ball to ball
  const arrivalZ = STRIKER_END_Z;
  const totalDx = arrivalX - releasePos.x;
  const totalDz = arrivalZ - releasePos.z;

  const pitchZ = BOWLER_END_Z + (STRIKER_END_Z - BOWLER_END_Z) * DUEL_GOOD_LENGTH_FRAC;
  const pitchFrac = totalDz !== 0 ? (pitchZ - releasePos.z) / totalDz : DUEL_GOOD_LENGTH_FRAC;
  const pitchX = releasePos.x + totalDx * pitchFrac; // bounce point sits on the aim-line, not jittered separately

  const horizDist = Math.max(0.001, Math.hypot(totalDx, totalDz));
  const pitchDist = Math.max(0.001, Math.hypot(pitchX - releasePos.x, pitchZ - releasePos.z));
  const t = Math.max(0.05, pitchDist / DUEL_BOWL_PACE);
  const vy0 = (DUEL_BALL_RADIUS - releasePos.y - 0.5 * DUEL_GRAVITY * t * t) / t;

  DUEL.ballVel.set((totalDx / horizDist) * DUEL_BOWL_PACE, vy0, (totalDz / horizDist) * DUEL_BOWL_PACE);
  DUEL.ball.position.copy(releasePos);
  DUEL.ball.visible = true;
  DUEL.held = false;
  DUEL.delivered = true;
  DUEL.targetContactHeight = DUEL_CONTACT_HEIGHT_MIN + Math.random() * (DUEL_CONTACT_HEIGHT_MAX - DUEL_CONTACT_HEIGHT_MIN);
}

// Debug aid for re-calibrating BAT_GRIP_CORRECTION_POS/ROT after the
// baseballIdle pose swap shifted the bat's resting position. When on,
// drops a small red marker at the bat blade's actual world position and
// a small yellow marker at the ball's position, every frame a swing is
// live. Compare the two on-screen to see exactly how far off the bat is
// and in which direction, instead of guessing correction numbers blind.
const DUEL_DEBUG_BAT_COLLISION = true;
let _debugBladeMarker = null;
let _debugBallMarker = null;
function updateBatCollisionDebugMarkers() {
  if (!DUEL_DEBUG_BAT_COLLISION) return;
  const bat = DUEL.striker && DUEL.striker.bat;
  if (!bat || !bat.blade) return;

  if (!_debugBladeMarker) {
    _debugBladeMarker = new THREE.Mesh(
      new THREE.SphereGeometry(0.05, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xff0000, depthTest: false })
    );
    _debugBladeMarker.renderOrder = 999;
    scene.add(_debugBladeMarker);
  }
  if (!_debugBallMarker) {
    _debugBallMarker = new THREE.Mesh(
      new THREE.SphereGeometry(0.05, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xffff00, depthTest: false })
    );
    _debugBallMarker.renderOrder = 999;
    scene.add(_debugBallMarker);
  }

  const bladeWorldPos = new THREE.Vector3();
  bat.blade.getWorldPosition(bladeWorldPos);
  _debugBladeMarker.position.copy(bladeWorldPos);
  _debugBladeMarker.visible = true;

  if (DUEL.ball && DUEL.ball.visible) {
    _debugBallMarker.position.copy(DUEL.ball.position);
    _debugBallMarker.visible = true;
  } else {
    _debugBallMarker.visible = false;
  }
}

function checkBatCollision() {
  const bat = DUEL.striker.bat;
  
  if (!bat) {
    console.log('DEBUG: DUEL.striker.bat is null');
    return null;
  }
  
  if (!bat.blade) {
    console.log('DEBUG: bat exists but bat.blade is null');
    console.log('DEBUG: bat properties:', Object.keys(bat).slice(0, 10));
    return null;
  }
  
  // Get bat's world position and rotation
  const batWorldPos = new THREE.Vector3();
  bat.getWorldPosition(batWorldPos);
  const batWorldQuat = new THREE.Quaternion();
  bat.getWorldQuaternion(batWorldQuat);
  
  // Ball position relative to bat
  const ballRelative = DUEL.ball.position.clone().sub(batWorldPos);
  
  // Transform ball position to bat's local space
  const batLocalQuat = batWorldQuat.clone().invert();
  ballRelative.applyQuaternion(batLocalQuat);
  
  // Check if ball is within blade bounding zone (with margin for ball radius)
  const margin = DUEL_BALL_RADIUS + 0.2;
  const bladeY = bat.blade.position.y;
  const bladeX = bat.blade.position.x;
  const bladeZ = bat.blade.position.z;
  
  // Check bounds - VERY LOOSE for testing
  const xCheck = Math.abs(ballRelative.x - bladeX);
  const yCheck = Math.abs(ballRelative.y - bladeY);
  const zCheck = Math.abs(ballRelative.z - bladeZ);
  
  console.log('Collision bounds check:', {
    xOK: xCheck <= (bat.bladeHalfWidth + margin),
    yOK: yCheck <= (bat.bladeHalfHeight + margin),
    zOK: zCheck <= (0.2 + margin),
    x: xCheck.toFixed(3),
    y: yCheck.toFixed(3),
    z: zCheck.toFixed(3)
  });
  
  if (xCheck > bat.bladeHalfWidth + margin ||
      yCheck > bat.bladeHalfHeight + margin ||
      zCheck > 0.2 + margin) {
    return null;
  }
  
  // Calculate contact quality
  const bladeYNorm = Math.abs(ballRelative.y - bladeY) / bat.bladeHalfHeight;
  const bladeXNorm = Math.abs(ballRelative.x - bladeX) / bat.bladeHalfWidth;
  
  let quality = 'middle';
  let power = 1.3;
  
  if (bladeYNorm > 0.8 || bladeXNorm > 0.85) {
    quality = 'edge';
    power = 0.6;
  } else if (bladeYNorm > 0.6 || bladeXNorm > 0.7) {
    quality = 'offcenter';
    power = 1.0;
  }
  
  console.log('Collision detected:', quality);
  
  return {
    quality: quality,
    power: power,
    contactY: ballRelative.y,
    batWorldPos: batWorldPos,
    batWorldQuat: batWorldQuat
  };
}

function hitBall(incomingSpeed, collision) {
  // Use collision data if available, otherwise default behavior
  let power = Math.max(14, (incomingSpeed || DUEL_BOWL_PACE) * 1.3);
  let angle = (Math.random() - 0.5) * Math.PI * 0.8;
  let verticalPower = 6;
  
  if (collision) {
    if (collision.quality === 'edge') {
      // EDGE HIT: Very weak, NO collision follow-through, just pops up
      // Ball barely leaves the crease area - minimal power application
      const bowlPace = incomingSpeed || DUEL_BOWL_PACE;
      power = bowlPace * 0.2;  // REDUCED - very weak horizontal power (edge shouldn't carry)
      angle = (Math.random() - 0.5) * Math.PI * 0.15;  // minimal deflection
      verticalPower = 16;  // goes VERY HIGH - mostly vertical
      
      console.log('EDGE HIT: WEAK power=' + power.toFixed(1) + ', vertical=' + verticalPower + ' (no collision check)');
      
    } else if (collision.quality === 'offcenter') {
      // OFF-CENTER: Normal hit, decent power
      const bowlPace = incomingSpeed || DUEL_BOWL_PACE;
      power = bowlPace * 1.1;  // slightly reduced
      angle = (Math.random() - 0.5) * Math.PI * 0.6;  // normal deflection
      verticalPower = 7;  // normal bounce
      
      console.log('OFFCENTER HIT: normal power=' + power.toFixed(1) + ', vertical=' + verticalPower);
      
    } else if (collision.quality === 'middle') {
      // MIDDLE HIT: MAXIMUM power + BOUNCE force
      // Good contact = maximum horizontal power + strong bounce force for power shots
      const bowlPace = incomingSpeed || DUEL_BOWL_PACE;
      power = bowlPace * 2.4;  // 140% MORE power - EXTRA STRONG
      angle = (Math.random() - 0.5) * Math.PI * 0.8;  // full deflection
      verticalPower = 9;  // STRONGER bounce force for middle hits
      
      console.log('MIDDLE HIT: MAXIMUM power=' + power.toFixed(1) + ', BOUNCE vertical=' + verticalPower);
    }
  }
  
  const dirX = Math.sin(angle);
  const dirZ = -Math.cos(angle);
  DUEL.ballVel.set(dirX * power, verticalPower, dirZ * power);
  DUEL.afterHit = true;  // now in the outfield-roll phase
  DUEL.fielderReactionTimer = FIELDER_REACTION_DELAY;
}

function resetDelivery() {
  DUEL.state = 'ready';
  DUEL.stateTimer = 0;
  DUEL.delivered = false;
  DUEL.swung = false;
  DUEL.committedThisBall = false;
  DUEL.impactApplied = false;
  DUEL.bestHitDist = undefined;
  DUEL.released = false;
  DUEL.leftBall = false;
  DUEL.predictedX = undefined;
  DUEL.afterHit = false;
  DUEL.ballVel.set(0, 0, 0);
  DUEL.held = true;
  DUEL.bowlTimer = null;
  DUEL.ball.visible = false;
  DUEL.ball.position.set(0, DUEL_BALL_RADIUS, -30);
  DUEL.striker.model.position.x = STRIKER_END_X; // back to his guard spot for the next ball
  DUEL.striker.model.position.y = 0; // undo any crouch/rise nudge from the last delivery
  DUEL.shuffleTargetX = STRIKER_END_X;
  DUEL.shuffleTargetY = 0;
  _duelPlayAction(DUEL.striker, 'baseballIdle');
  DUEL.fielderReactionTimer = 0;
  DUEL.returning = false;
  DUEL.returnComplete = false;
  DUEL.ballHeldByFielder = false;
  DUEL.fielderClaim = null; // release the claim so any fielder can react to the next delivery's ball
  DUEL.returnThrowStart = null;
  DUEL.returnThrowTarget = null;
  DUEL.returnThrowDuration = 0;
  DUEL.returnThrowElapsed = 0;
  for (const f of FIELDERS) {
    f.chaseState = 'base';
    f.pickupTimer = 0;
    f.throwTimer = 0;
    f.thrown = false;
    f.model.position.set(f.home.x, 0, f.home.z);
    f.model.rotation.y = Math.atan2(-f.home.x, -f.home.z); // same "face the pitch centre" convention as spawnFielder
    _duelPlayAction(f, 'idle');
  }
}

function updateDuel(dt) {
  if (!DUEL.striker || !DUEL.ball) return;
  DUEL.stateTimer += dt;

  // ---- ball physics, only while it's actually in the air/on the ground (not held) ----
  // Also gated off while a fielder's got hold of it (ballHeldByFielder,
  // during the pickup pause + throw wind-up) or while it's mid-return-throw
  // (returning, handled by its own simpler physics in updateReturnThrow) —
  // this block's bounce solve is tuned specifically for the bowler-to-
  // striker delivery arc and would fight both of those.
  if (DUEL.delivered && !DUEL.held && !DUEL.ballHeldByFielder && !DUEL.returning) {
    const v = DUEL.ballVel;
    v.y += DUEL_GRAVITY * dt;
    DUEL.ball.position.x += v.x * dt;
    DUEL.ball.position.y += v.y * dt;
    DUEL.ball.position.z += v.z * dt;

    // Wall collision: if ball hits stadium wall, bounce gently back (minimal force)
    const ballRadius = Math.hypot(DUEL.ball.position.x, DUEL.ball.position.z);
    if (ballRadius > STADIUM_WALL_R - 0.5) {
      // Ball hit the stadium wall/advertising board area
      const wallDist = ballRadius - (STADIUM_WALL_R - 0.5);
      if (wallDist > 0) {
        // Push ball back inward gently
        const angle = Math.atan2(DUEL.ball.position.z, DUEL.ball.position.x);
        DUEL.ball.position.x = (STADIUM_WALL_R - 0.5) * Math.cos(angle);
        DUEL.ball.position.z = (STADIUM_WALL_R - 0.5) * Math.sin(angle);
        
        // Reverse radial velocity only (minimal bounce), reduce significantly
        const radialVel = v.x * Math.cos(angle) + v.z * Math.sin(angle);
        if (radialVel > 0) {
          // Ball moving outward, bounce it back with very small force
          v.x -= radialVel * 0.3 * Math.cos(angle);  // 30% reverse (not 100%)
          v.z -= radialVel * 0.3 * Math.sin(angle);
        }
      }
    }

    const groundHeight = groundHeightAt(DUEL.ball.position.x, DUEL.ball.position.z) + DUEL_BALL_RADIUS;
    if (DUEL.ball.position.y <= groundHeight) {
      DUEL.ball.position.y = groundHeight;
      if (v.y < 0) {
        // Instead of a flat restitution ratio (which left the ball barely
        // off the turf — low enough that it bounced a second time before
        // ever reaching the striker), solve for the exact upward speed
        // that carries it to a hittable height right as it arrives at the
        // striker's crease.
        const remaining = STRIKER_END_Z - DUEL.ball.position.z;
        const t2 = v.z > 0.05 ? remaining / v.z : -1;
        if (t2 > 0.05) {
          const targetH = DUEL.targetContactHeight || 0.85;
          let vyBounce = (targetH - groundHeight - 0.5 * DUEL_GRAVITY * t2 * t2) / t2;
          v.y = Math.max(1.5, Math.min(12, vyBounce));
        } else {
          v.y = -v.y * DUEL_BOUNCE_RESTITUTION; // already past/level with striker — just a normal bounce
        }
      }
      // Rolling friction: this only ever damped the vertical bounce above —
      // horizontal speed (v.x/v.z) was never touched once grounded, so a hit
      // ball just skated across the outfield at constant speed forever
      // instead of rolling out and stopping like a real struck ball. Only
      // applies once DUEL.afterHit is true (see hitBall) — the bowler's own
      // pitch-bounce on the way to the striker must NOT be damped here, or
      // it'd bleed off pace before arrival and throw out the swing-timing
      // math in the 'inFlight' branch below, which assumes ~constant vz.
      // Applied as an exponential decay so it's frame-rate independent (same
      // slowdown whether dt is small or the clamped 0.05 worst case), then
      // snapped to exactly zero once it's crawling slowly enough that the
      // asymptote would otherwise never actually finish — that snap is also
      // what lets the "stopped" check below ever become true on its own,
      // instead of a hit only ever ending via the wayPast distance cutoff.
      if (DUEL.afterHit) {
        // Apply friction - but EDGE hits stop faster, MIDDLE hits roll further
        let frictionMultiplier = 1.0;  // default
        
        // Check what kind of hit this was by looking at ball velocity
        const speed = Math.hypot(v.x, v.z);
        if (speed < 5) {
          // EDGE hit - stops quickly (weak hit)
          frictionMultiplier = 1.5;  // 50% more friction
        } else if (speed > 25) {
          // MIDDLE hit - rolls far (strong hit)
          frictionMultiplier = 0.7;  // 30% less friction
        }
        
        const groundFrictionDecay = Math.pow(0.06 * frictionMultiplier, dt);
        v.x *= groundFrictionDecay;
        v.z *= groundFrictionDecay;
        if (v.x * v.x + v.z * v.z < 0.04) { v.x = 0; v.z = 0; }
      }
    }
    if (v.lengthSq() > 0.01) DUEL.ball.rotation.x += v.z * dt * 2; // visual roll/spin only
  }

  // Mixers update here (rather than at the very end) so bone transforms —
  // and therefore the bat's world position — are current for this same
  // frame's impact check below, not one frame stale.
  DUEL.striker.mixer.update(dt);
  if (DUEL.bowler) DUEL.bowler.mixer.update(dt);
  for (const f of FIELDERS) f.mixer.update(dt);

  // Auto-deliver the ball without bowler animation
  if (DUEL.bowlTimer !== null) {
    DUEL.bowlTimer += dt;
    const bowlDuration = 0.5; // simplified delivery time
    if (!DUEL.released && DUEL.bowlTimer >= bowlDuration * DUEL_RELEASE_FRAC) {
      DUEL.released = true;
      deliverBall();
      DUEL.state = 'inFlight';
      DUEL.stateTimer = 0;
    }
    if (DUEL.bowlTimer >= bowlDuration) {
      DUEL.bowlTimer = null;
    }
  }

  if (DUEL.state === 'ready') {
    if (DUEL.stateTimer >= DUEL_PAUSE_BEFORE_BOWL) {
      DUEL.state = 'bowling';
      DUEL.stateTimer = 0;
      DUEL.bowlTimer = 0;
      // Auto-deliver without animation
    }
  } else if (DUEL.state === 'inFlight') {
    if (!DUEL.committedThisBall) {
      const remaining = DUEL_CONTACT_Z - DUEL.ball.position.z;
      const vz = DUEL.ballVel.z;

      // Track exactly where the ball is going to cross the striker's line —
      // refreshed every frame right up until the swing actually triggers.
      // This just updates the TARGET; the actual easing toward it happens
      // once, unconditionally, at the bottom of this whole 'inFlight'
      // branch (see below) so the same code also carries the striker back
      // to his guard spot once the swing/leave is done, instead of only
      // running while still deciding.
      // predictedX is kept UNCLAMPED and stored on DUEL so the reach check
      // below can compare against where the ball is actually going, not
      // against the clamped spot the striker's feet can physically reach —
      // those are two different questions (can I get my feet there vs. can
      // I get the bat there) and conflating them was the bug: a truly wide
      // ball would still pass a reach check that only ever looked at the
      // already-clamped shuffle target.
      if (vz > 0.05 && remaining > 0) {
        const timeToLine = remaining / vz;
        const predictedX = DUEL.ball.position.x + DUEL.ballVel.x * timeToLine;
        DUEL.predictedX = predictedX;
        DUEL.shuffleTargetX = Math.max(
          STRIKER_END_X - DUEL_STRIKER_SHUFFLE_MAX,
          Math.min(STRIKER_END_X + DUEL_STRIKER_SHUFFLE_MAX, predictedX)
        );
      }

      // Vertical counterpart to the shuffle above: the ball's arrival
      // height is already known ahead of time (the bounce physics solves
      // for DUEL.targetContactHeight directly — see the bounce block in
      // the ball-physics section), so nudge the striker's root up or down
      // a small amount toward it — a slight crouch for a low one, a
      // slight rise for a bouncer — instead of always swinging from a
      // fixed standing height regardless of where the ball's actually
      // arriving.
      const targetHeight = DUEL.targetContactHeight || DUEL_BAT_NATURAL_HEIGHT;
      DUEL.shuffleTargetY = Math.max(
        -DUEL_STRIKER_VSHUFFLE_MAX,
        Math.min(DUEL_STRIKER_VSHUFFLE_MAX, targetHeight - DUEL_BAT_NATURAL_HEIGHT)
      );

      // Real "read the bowling" timing: instead of always starting the
      // swing a fixed time before arrival, work out exactly how long
      // the ball still needs (its current speed — which already reflects
      // the bowler's pace off this particular delivery — divided into the
      // remaining distance, which reflects where it pitched/how far down
      // the "length" it already travelled) and start the swing so the
      // clip's own bat-meets-ball frame lines up with that arrival time.
      const eta = vz > 0.05 ? remaining / vz : Infinity;
      const swingClip = DUEL.striker.actions.baseballStrike.getClip();
      const swingLeadNeeded = swingClip.duration * DUEL_SWING_IMPACT_FRAC;

      // The commit point used to be timed purely off the swing animation's
      // own lead time, which assumes the striker's feet are already where
      // they need to be. On a ball that needs real footwork (wide of his
      // current spot) that's not true yet — so also work out how long the
      // shuffle itself still needs, and commit whichever comes first,
      // animation lead or travel time. That way a wide-but-reachable ball
      // gets decided on early enough for the feet to actually arrive before
      // the bat swings, instead of swinging from wherever he happens to be
      // standing at the animation-only deadline.
      const xTarget = DUEL.predictedX !== undefined ? DUEL.predictedX : STRIKER_END_X;
      const moveTimeNeeded = Math.abs(xTarget - DUEL.striker.model.position.x) / DUEL_STRIKER_SHUFFLE_SPEED;
      const leadNeeded = Math.max(swingLeadNeeded, moveTimeNeeded) + DUEL_SWING_EXTRA_LEAD;

      if (eta <= leadNeeded) {
        // Always swing once committed — no leaving a ball because it's
        // technically outside some reach zone. Every delivery this bowler
        // throws lands within the height/line range set up in deliverBall,
        // so there's no such thing as a "genuinely unreachable" ball here;
        // he takes a swing at every single one.
        DUEL.committedThisBall = true;
        DUEL.leftBall = false;
        DUEL.swingTimer = 0;
        DUEL.impactApplied = false;
        DUEL.swung = true;
        _duelPlayAction(DUEL.striker, 'baseballStrike');
      }
    } else if (!DUEL.leftBall) {
      DUEL.swingTimer += dt;
      const swingClip = DUEL.striker.actions.baseballStrike.getClip();

      // Contact is no longer decided by measuring distance to the bat
      // mesh's animated world position. That position depends on
      // BAT_GRIP_LOCAL_POS/ROT, which is an uncalibrated guess (see the
      // comment where it's defined) — so that check could fail every time
      // regardless of how correct the timing/footwork logic was, which is
      // exactly what was happening. Instead: while a swing is in progress
      // and hasn't connected yet, the instant the ball reaches the
      // striker's batting line, it's a hit. He already committed to this
      // swing (every ball gets one now), so there's nothing left to
      // adjudicate — connect it.
      if (!DUEL.impactApplied && DUEL.ball.position.z >= DUEL_CONTACT_Z) {
        DUEL.impactApplied = true;
        const incomingSpeed = DUEL.ballVel.length();
        
        console.log('HIT TRIGGERED - checking collision...');
        const collision = checkBatCollision();
        
        let qualityLabel = 'middle';
        let powerMult = 1.3;
        let hitCollision = collision;
        
        if (collision) {
          console.log('Ball hit: ' + collision.quality + ' (power: ' + (collision.power * 100).toFixed(0) + '%)');
          qualityLabel = collision.quality;
          
          // Set power multiplier for label - UPDATED with new force system
          if (collision.quality === 'edge') {
            powerMult = 0.2;  // REDUCED - edge hits are weak now
          } else if (collision.quality === 'offcenter') {
            powerMult = 1.1;
          } else if (collision.quality === 'middle') {
            powerMult = 2.4;  // INCREASED - middle hits have EXTRA power + bounce
          }
        } else {
          // No collision detected - pick random quality (with new force multipliers)
          const rand = Math.random();
          if (rand < 0.33) {
            qualityLabel = 'edge';
            powerMult = 0.2;  // REDUCED - edge hits are weak
            hitCollision = { quality: 'edge', power: 0.2 };
          } else if (rand < 0.66) {
            qualityLabel = 'offcenter';
            powerMult = 1.1;
            hitCollision = { quality: 'offcenter', power: 1.1 };
          } else {
            qualityLabel = 'middle';
            powerMult = 2.4;  // INCREASED - middle hits have EXTRA power + bounce
            hitCollision = { quality: 'middle', power: 2.4 };
          }
          console.log('No collision - random hit: ' + qualityLabel + ' (' + (powerMult * 100).toFixed(0) + '%)');
        }
        
        // Warp the ball onto the bat's actual mesh position before firing
        // it off. Up to now the ball stayed on its own incoming flight
        // line and only had its velocity flipped, so it left from wherever
        // it happened to be on that arc — which usually wasn't anywhere
        // near where the bat model actually was, hence the "hit connects
        // but looks like it came out of thin air" look. Snapping it onto
        // the bat blade (or a sensible fallback point on the bat/hand if
        // the blade can't be read) guarantees the ball visually leaves
        // from contact every time, regardless of any small drift between
        // the swing animation and the grip offset.
        const bat = DUEL.striker.bat;
        if (bat) {
          const contactPoint = new THREE.Vector3();
          if (bat.blade) {
            bat.blade.getWorldPosition(contactPoint);
          } else {
            bat.getWorldPosition(contactPoint);
          }
          DUEL.ball.position.copy(contactPoint);
        }
        
        createHitQualityLabel(qualityLabel, powerMult);
        hitBall(incomingSpeed, hitCollision);
      }
      if (DUEL.swingTimer >= swingClip.duration) {
        DUEL.swung = false;  // reset swing flag immediately when animation finishes
        // Stop the swing action and play idle
        if (DUEL.striker.actions.swing) {
          DUEL.striker.actions.swing.stop();
        }
        _duelPlayAction(DUEL.striker, 'baseballIdle');
        // Ease back to the guard spot now that the swing's done, instead
        // of staying frozen in the crouch/shuffle pose until resetDelivery
        // hard-snaps it later.
        DUEL.shuffleTargetX = STRIKER_END_X;
        DUEL.shuffleTargetY = 0;
      }
    }

    // Ease the striker's root toward wherever shuffleTargetX/Y currently
    // point, every single frame this state is active — regardless of
    // whether we're still deciding, mid-swing, or already done. That's
    // what makes him glide back to his guard spot right after the swing
    // or a leave, instead of sitting stuck in the offset pose until the
    // next delivery's hard reset.
    const moveStep = DUEL_STRIKER_SHUFFLE_SPEED * dt;
    const dxMove = DUEL.shuffleTargetX - DUEL.striker.model.position.x;
    if (Math.abs(dxMove) <= moveStep) {
      DUEL.striker.model.position.x = DUEL.shuffleTargetX;
    } else {
      DUEL.striker.model.position.x += Math.sign(dxMove) * moveStep;
    }
    const vMoveStep = DUEL_STRIKER_VSHUFFLE_SPEED * dt;
    const dyMove = DUEL.shuffleTargetY - DUEL.striker.model.position.y;
    if (Math.abs(dyMove) <= vMoveStep) {
      DUEL.striker.model.position.y = DUEL.shuffleTargetY;
    } else {
      DUEL.striker.model.position.y += Math.sign(dyMove) * vMoveStep;
    }

    const groundHeight = groundHeightAt(DUEL.ball.position.x, DUEL.ball.position.z) + DUEL_BALL_RADIUS;
    const stopped = DUEL.ballVel.lengthSq() < 0.05 && DUEL.ball.position.y <= groundHeight + 0.01;
    
    // Check if ball hit dugout roof or went out of stadium
    const ballRadius = Math.hypot(DUEL.ball.position.x, DUEL.ball.position.z);
    const hitDugoutRoof = DUEL.ball.position.x > DUGOUT_MIN_X && DUEL.ball.position.x < DUGOUT_MAX_X && 
                          DUEL.ball.position.z > DUGOUT_MIN_Z && DUEL.ball.position.z < DUGOUT_MAX_Z &&
                          DUEL.ball.position.y > DUGOUT_ROOF_Y;
    const outOfStadium = ballRadius > STADIUM_EDGE_R;
    
    const wayPast = hitDugoutRoof || outOfStadium || DUEL.ball.position.z > STRIKER_END_Z + 15 || Math.abs(DUEL.ball.position.x) > 40;
    if (stopped || wayPast) {
      DUEL.state = 'resolved';
      DUEL.stateTimer = 0;
    }
  } else if (DUEL.state === 'resolved') {
    // Gated on the full chase/pickup/throw/collect loop finishing
    // (DUEL.returnComplete, set by updateReturnThrow once the bowler
    // collects the ball) rather than a flat timer from the moment the hit
    // ball first stopped — otherwise the reset could fire mid-chase and cut
    // a fielder's run/throw off.
    if (DUEL.returnComplete) {
      if (DUEL.stateTimer >= DUEL_RESET_DELAY) resetDelivery();
    } else if (DUEL.stateTimer >= DUEL_RESOLVED_WATCHDOG_TIMEOUT) {
      // Watchdog: the loop above never actually finished — nobody ever
      // chased the ball down (it stopped outside every fielder's
      // FIELDER_REACTION_RADIUS), a fielder got stuck mid-chase, or a
      // return throw missed the bowler and rolled to a stop just outside
      // pickup range. Force the next delivery instead of hanging here.
      console.warn('Fielding watchdog: forcing reset after ' + DUEL_RESOLVED_WATCHDOG_TIMEOUT + 's without a completed return-and-collect.');
      resetDelivery();
    }
  }

}

function initDuelCharacters(loader) {
  DUEL.striker = spawnDuelCharacter(loader, STRIKER_END_X, STRIKER_END_Z, STRIKER_FACING_YAW);
  if (!DUEL.striker) {
    console.error('Duel test: failed to spawn striker instance.');
    return;
  }
  
  DUEL.bowler = spawnDuelCharacter(loader, BOWLER_END_X, BOWLER_END_Z, BOWLER_FACING_YAW);
  if (!DUEL.bowler) {
    console.error('Duel test: failed to spawn bowler instance.');
    return;
  }
  
  DUEL.striker.bat = attachBatToHand(DUEL.striker);

  DUEL.ball = createFetchBall(); // same ball geometry/material as the fetch-chaser above
  DUEL.ball.visible = false;
  DUEL.ball.position.set(STRIKER_END_X, DUEL_BALL_RADIUS, STRIKER_END_Z + 0.3);
  scene.add(DUEL.ball);

  _duelPlayAction(DUEL.striker, 'baseballIdle');
  _duelPlayAction(DUEL.bowler, 'idle');

  FIELDERS = FIELDER_SPAWN_SPOTS
    .map((spot) => spawnFielder(loader, spot))
    .filter((f) => f !== null);
  for (const f of FIELDERS) _duelPlayAction(f, 'idle');
  console.log('Fielder spawn: ' + FIELDERS.length + '/' + FIELDER_SPAWN_SPOTS.length + ' fielders on the field.');

  console.log('Duel test: striker at (' + STRIKER_END_X.toFixed(2) + ',' + STRIKER_END_Z.toFixed(2) + ').');
}

async function initFBXTestCharacter() {
  _fbxTestHud.textContent = 'FBX test: loading fflate.min.js…';
  const fflateOk = await _fbxLoadFirstWorking([
    'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/fflate.min.js',
    'https://unpkg.com/three@0.128.0/examples/js/libs/fflate.min.js'
  ], 'fflate.min.js');
  if (!fflateOk) {
    console.warn('FBX test: could not load fflate.min.js from any mirror — continuing anyway, these files likely do not need it.');
  }

  _fbxTestHud.textContent = 'FBX test: loading FBXLoader.js…';
  const fbxLoaderOk = await _fbxLoadFirstWorking([
    'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js',
    'https://unpkg.com/three@0.128.0/examples/js/loaders/FBXLoader.js'
  ], 'FBXLoader.js');
  if (!fbxLoaderOk) {
    console.error('FBX test: could not load FBXLoader.js from any CDN mirror. Check your network settings / ad blocker.');
    _fbxTestHud.textContent = 'FBX test: FAILED — could not load FBXLoader.js from any CDN.';
    return;
  }

  _fbxTestHud.textContent = 'FBX test: loading SkeletonUtils.js…';
  const skelUtilsOk = await _fbxLoadFirstWorking([
    'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js',
    'https://unpkg.com/three@0.128.0/examples/js/utils/SkeletonUtils.js'
  ], 'SkeletonUtils.js');
  if (!skelUtilsOk) {
    console.error('FBX test: could not load SkeletonUtils.js from any CDN mirror. Check your network settings / ad blocker.');
    _fbxTestHud.textContent = 'FBX test: FAILED — could not load SkeletonUtils.js from any CDN.';
    return;
  }

  _fbxTestHud.textContent = 'FBX test: loading character + clips from assets/animations/…';
  await runFBXTestCharacter();
}

initFBXTestCharacter();

// ---------- Animation loop ----------
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  updateDuel(dt);
  updateBatCollisionDebugMarkers();
  updateFielderAI(dt);
  updateReturnThrow(dt);
  updateHitLabels(dt);
  _fbxTestUpdateHud();

  if (!isTouch) updateKeyMove();

  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  const len = Math.hypot(move.forward, move.right);
  let fMove = move.forward, rMove = move.right;
  if (len > 1) { fMove /= len; rMove /= len; }

  const speed = WALK_SPEED * (running ? RUN_MULT : 1);
  const forwardDir = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  const rightDir = new THREE.Vector3(Math.sin(yaw + Math.PI/2), 0, Math.cos(yaw + Math.PI/2));

  velocity.set(0,0,0);
  velocity.addScaledVector(forwardDir, fMove * speed);
  velocity.addScaledVector(rightDir, rMove * speed);

  camera.position.x += velocity.x * dt;
  camera.position.z += velocity.z * dt;
  camera.position.y = EYE_HEIGHT;

  // keep inside the world bounds (grass extends beneath/around the stadium)
  const half = WORLD_SIZE/2 - 5;
  camera.position.x = Math.max(-half, Math.min(half, camera.position.x));
  camera.position.z = Math.max(-half, Math.min(half, camera.position.z));

  // Resolve collisions with stadium walls and dugout
  resolvePlayerStadiumWallCollision(camera.position, PLAYER_COLLISION_RADIUS);
  resolveDugoutCollision(camera.position);

  renderer.render(scene, camera);
}
animate();
</script>
