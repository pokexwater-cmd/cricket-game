<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>3D Walk Controller</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; width:100%; height:100%; background:#111; font-family: -apple-system, sans-serif; }
  canvas { display:block; }

  #hint {
    position:absolute; bottom:12px; left:12px;
    color:#fff; background:rgba(0,0,0,0.5); padding:4px 8px; border-radius:6px;
    font-size:9px; text-align:left; pointer-events:none; z-index:10;
    transition: opacity 0.4s; max-width:200px; line-height:1.2;
  }

  /* Mobile joystick (movement) */
  #joyZone {
    position:absolute; left:0; bottom:0; width:45vw; height:45vh;
    z-index:5; touch-action:none;
  }
  #joyBase {
    position:absolute; width:100px; height:100px; border-radius:50%;
    background:rgba(255,255,255,0.15); border:2px solid rgba(255,255,255,0.4);
    display:none; pointer-events:none;
  }
  #joyStick {
    position:absolute; width:46px; height:46px; border-radius:50%;
    background:rgba(255,255,255,0.6); pointer-events:none;
  }

  /* Mobile look zone (right half) */
  #lookZone {
    position:absolute; right:0; bottom:0; width:55vw; height:100vh;
    z-index:4; touch-action:none;
  }

  #mobileControls { display:none; }
  .isTouch #mobileControls { display:block; }
  .isTouch #hint { display:none; }

  /* Settings button + panel */
  #settingsBtn {
    position:absolute; top:12px; right:12px; z-index:30;
    width:42px; height:42px; border-radius:50%;
    background:rgba(0,0,0,0.55); border:1px solid rgba(255,255,255,0.25);
    color:#fff; font-size:20px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; user-select:none;
  }
  #settingsPanel {
    position:absolute; top:0; right:0; z-index:40;
    width:260px; max-width:80vw; height:100%;
    background:rgba(20,20,25,0.95); color:#fff;
    box-shadow:-4px 0 20px rgba(0,0,0,0.4);
    transform:translateX(100%); transition:transform 0.25s ease;
    padding:16px; box-sizing:border-box; font-size:14px;
  }
  #settingsPanel.open { transform:translateX(0); }
  #settingsPanel h3 { margin:6px 0 18px 0; font-size:16px; }
  #settingsPanel label { display:block; margin-bottom:6px; opacity:0.85; }
  #settingsPanel .row { margin-bottom:22px; }
  #settingsPanel input[type=range] { width:100%; }
  #sensValue { opacity:0.7; }
  #backBtn {
    display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2);
    color:#fff; padding:8px 12px; border-radius:8px; cursor:pointer;
    width:100%; font-size:14px; margin-bottom:20px;
  }
  #backBtn:active { background:rgba(255,255,255,0.2); }
  
  /* Hide FBX test HUD */
  #fbxTestHud, [id*="fbx"], [id*="FBX"], [class*="fbx"], [class*="FBX"] { display:none !important; }
</style>
</head>
<body>

<div id="hint">Click: look • WASD: move • Shift: run • R: reset • Esc: release</div>

<div id="settingsBtn">&#9881;</div>
<div id="settingsPanel">
  <button id="backBtn">&#8592; Back</button>
  <h3>Settings</h3>
  <div class="row">
    <label>Look sensitivity <span id="sensValue">1.0</span></label>
    <input type="range" id="sensSlider" min="0.1" max="3" step="0.1" value="1">
  </div>
  <!-- more settings will go here later -->
</div>

<div id="mobileControls">
  <div id="joyZone">
    <div id="joyBase"></div>
    <div id="joyStick"></div>
  </div>
  <div id="lookZone"></div>
</div>

<script>
// Suppress all console output — send messages to the void instead of dev tools
(function() {
  const noop = () => {};
  window.console = { log: noop, warn: noop, error: noop, info: noop, debug: noop };
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- Setup ----------
let isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 ||
  (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
if (isTouch) document.body.classList.add('isTouch');

// Fallback: some in-app webviews report no touch support at load time even
// though the device is touch-only. If a real touch ever happens, switch to
// touch controls immediately so the player is never stuck with no input.
window.addEventListener('touchstart', () => {
  if (!isTouch) {
    isTouch = true;
    document.body.classList.add('isTouch');
  }
}, { passive: true });

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fbfe0);
scene.fog = new THREE.Fog(0x8fbfe0, 60, 400);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 1000);
const EYE_HEIGHT = 1.7;
camera.position.set(0, EYE_HEIGHT, 35);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, isTouch ? 1.5 : 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- Lighting ----------
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const hemi = new THREE.HemisphereLight(0xbfe3ff, 0x3a5a2f, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(80, 120, 40);
sun.castShadow = true;
sun.shadow.mapSize.set(isTouch ? 1024 : 2048, isTouch ? 1024 : 2048);
sun.shadow.camera.left = -150;
sun.shadow.camera.right = 150;
sun.shadow.camera.top = 150;
sun.shadow.camera.bottom = -150;
sun.shadow.camera.far = 400;
scene.add(sun);

// ---------- Cricket Stadium Environment ----------
let WORLD_SIZE = 500;          // grass world size, used later by the movement clamp
let lookSensitivity = 1.0;     // used later by mouse/touch look handlers
let updateCharacterBillboards = function () {}; // replaced below if character setup succeeds
let PITCH_LEN = 20.1;           // ~22 yards; hoisted so code after the try block can use it
let PITCH_WID = 3.05;           // 10 ft; hoisted for the same reason

// Stadium and collision constants - hoisted so they can be used everywhere
let STADIUM_EDGE_R = 113;      // outer edge of the stadium seating bowl, used to hard-stop a big lofted six; refined below once the stands are actually built
let STAND_START_R = 76;        // inner radius where the sloped seating bowl begins (outfield ends, stands start); refined below once the stands are actually built
let STAND_PROFILE = [];        // (radius, height) points tracing the seating bowl's sloped surface, used so the ball actually lands/bounces ON TOP of the stands instead of clipping through them; populated below once the stands are built
let STADIUM_WALL_R = 72.5;     // radius of the low blue advertising-board ring — solid to the player, so walking around the outfield stops here instead of clipping through the boards into the seating bowl; refined below once OUTFIELD_R is known

// Dugout collision constants
let DUGOUT_MIN_X = 71, DUGOUT_MAX_X = 75.4;
let DUGOUT_MIN_Z = -5.5, DUGOUT_MAX_Z = 5.5;
let PLAYER_DUGOUT_X = 0, PLAYER_DUGOUT_Z = 0;
let DUGOUT_PLAYER_NOOK_MIN_Z = 0.3;
let DUGOUT_ROOF_Y = 2.5;
const PLAYER_COLLISION_RADIUS = 0.4;
let DUGOUT_SEAT_POSITIONS = [];

// Collision functions
function resolveDugoutCollision(pos) {
  if (pos.x < DUGOUT_MIN_X || pos.x > DUGOUT_MAX_X) return;
  if (pos.z >= DUGOUT_PLAYER_NOOK_MIN_Z) return; // allow standing in positive-Z half
  const cz = Math.max(DUGOUT_MIN_Z, Math.min(pos.z, DUGOUT_MAX_Z));
  const closest_z = Math.abs(pos.z - DUGOUT_MIN_Z) < Math.abs(pos.z - DUGOUT_MAX_Z) ? DUGOUT_MIN_Z : DUGOUT_MAX_Z;
  pos.z = closest_z + Math.sign(pos.z - closest_z) * PLAYER_COLLISION_RADIUS;
}

function resolvePlayerStadiumWallCollision(pos, radius) {
  const dx = pos.x, dz = pos.z;
  const dist = Math.hypot(dx, dz);
  const maxR = STADIUM_WALL_R - radius;
  if (dist <= maxR || dist < 0.0001) return;
  const scale = maxR / dist;
  pos.x = dx * scale;
  pos.z = dz * scale;
}

function groundHeightAt(x, z) {
  const r = Math.hypot(x, z);
  if (r <= STAND_START_R || STAND_PROFILE.length < 2) return 0;
  const last = STAND_PROFILE[STAND_PROFILE.length - 1];
  if (r >= last.x) return last.y;
  for (let i = 0; i < STAND_PROFILE.length - 1; i++) {
    const p0 = STAND_PROFILE[i], p1 = STAND_PROFILE[i + 1];
    if (r >= p0.x && r <= p1.x) {
      const t = (r - p0.x) / (p1.x - p0.x);
      return p0.y + t * (p1.y - p0.y);
    }
  }
  return last.y;
}

try {
const OUTFIELD_R   = 70;   // radius of the grass playing area
const BOUNDARY_R   = 68;   // white boundary rope
WORLD_SIZE = 500;  // grass extends out beneath the stands too

// Base grass texture (used for outfield + surrounding grass)
function makeGrassTexture() {
  const size = 512;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#4c9a4c';
  ctx.fillRect(0, 0, size, size);
  for (let i = 0; i < 4000; i++) {
    ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.04)';
    ctx.fillRect(Math.random()*size, Math.random()*size, 2, 2);
  }
  // faint mow-stripe rings
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 14;
  for (let r = 20; r < size; r += 40) {
    ctx.beginPath(); ctx.arc(size/2, size/2, r, 0, Math.PI*2); ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}
const grassTexBase = makeGrassTexture();

// Surrounding grass (under stands / beyond stadium, so no void)
const outerGrassTex = grassTexBase.clone();
outerGrassTex.needsUpdate = true;
outerGrassTex.repeat.set(60, 60);
const outerGrass = new THREE.Mesh(
  new THREE.PlaneGeometry(WORLD_SIZE, WORLD_SIZE),
  new THREE.MeshStandardMaterial({ map: outerGrassTex, roughness: 1, color: 0x336633 })
);
outerGrass.rotation.x = -Math.PI/2;
outerGrass.position.y = -0.05;
outerGrass.receiveShadow = true;
scene.add(outerGrass);

// Outfield (circular playing area)
const outfieldTex = grassTexBase.clone();
outfieldTex.needsUpdate = true;
outfieldTex.repeat.set(10, 10);
const outfield = new THREE.Mesh(
  new THREE.CircleGeometry(OUTFIELD_R, 96),
  new THREE.MeshStandardMaterial({ map: outfieldTex, roughness: 1 })
);
outfield.rotation.x = -Math.PI/2;
outfield.receiveShadow = true;
scene.add(outfield);

// The "square" — mown lighter patch around the pitch
const squareMat = new THREE.MeshStandardMaterial({ color: 0x6ab04c, roughness: 1 });
const square = new THREE.Mesh(new THREE.CircleGeometry(16, 48), squareMat);
square.rotation.x = -Math.PI/2;
square.position.y = 0.005;
square.receiveShadow = true;
scene.add(square);

// Pitch strip
const pitchMat = new THREE.MeshStandardMaterial({ color: 0xC2A878, roughness: 0.95 });
const pitchMesh = new THREE.Mesh(new THREE.PlaneGeometry(PITCH_WID, PITCH_LEN), pitchMat);
pitchMesh.rotation.x = -Math.PI/2;
pitchMesh.position.y = 0.01;
pitchMesh.receiveShadow = true;
scene.add(pitchMesh);

// Helper for thin white line meshes
const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
function addLine(w, d, x, z, y = 0.02, rotY = 0) {
  const line = new THREE.Mesh(new THREE.PlaneGeometry(w, d), lineMat);
  line.rotation.x = -Math.PI/2;
  line.rotation.z = rotY;
  line.position.set(x, y, z);
  scene.add(line);
  return line;
}

// Crease markings at both ends of the pitch
const stumpsZ = PITCH_LEN/2 - 1.2; // stumps set slightly in from pitch edge
[1, -1].forEach(sign => {
  const z = sign * stumpsZ;
  // bowling crease (at the stumps, along width)
  addLine(2.64, 0.06, 0, z);
  // popping crease, 1.22m in front of the stumps
  addLine(3.66, 0.06, 0, z - sign*1.22);
  // return creases (short lines perpendicular, either side)
  const rc = new THREE.Mesh(new THREE.PlaneGeometry(0.06, 2.44), lineMat);
  rc.rotation.x = -Math.PI/2;
  rc.position.set(1.32, 0.02, z - sign*1.22 + sign*1.22);
  scene.add(rc);
  const rc2 = rc.clone();
  rc2.position.x = -1.32;
  scene.add(rc2);

  // Stumps (3 little cylinders) at each end
  for (let s = -1; s <= 1; s++) {
    const stump = new THREE.Mesh(
      new THREE.CylinderGeometry(0.02, 0.02, 0.28, 8),
      new THREE.MeshStandardMaterial({ color: 0xe8d9b0 })
    );
    stump.position.set(s * 0.1, 0.14, z);
    stump.castShadow = true;
    scene.add(stump);
  }
});

// Boundary rope (white circle)
{
  const pts = [];
  const segs = 128;
  for (let i = 0; i <= segs; i++) {
    const a = (i/segs) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a)*BOUNDARY_R, 0.03, Math.sin(a)*BOUNDARY_R));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const boundary = new THREE.LineLoop(geo, new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 3 }));
  scene.add(boundary);
}

// Low advertising boards ring, just outside the boundary
{
  const boardR = OUTFIELD_R + 2.5;
  STADIUM_WALL_R = boardR; // now that OUTFIELD_R is known, lock the player-collision wall to the board's actual radius
  const boardMat = new THREE.MeshStandardMaterial({ color: 0x1e5fa8, side: THREE.DoubleSide });
  const boardGeo = new THREE.CylinderGeometry(boardR, boardR, 1.1, 96, 1, true);
  const boards = new THREE.Mesh(boardGeo, boardMat);
  boards.position.y = 0.55;
  boards.receiveShadow = true;
  scene.add(boards);
}

// ---------- Round tiered stadium seating (textured bowl) ----------
let topR, topY;
{
  // Build a seat-pattern texture: a grid of individually colored "seats"
  function makeSeatTexture() {
    const cell = 32, cols = 8, rows = 8;
    const size = cell * cols;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#20242b';
    ctx.fillRect(0, 0, size, size);
    const palette = ['#d94f4f', '#e07b39', '#f2c14e', '#4f8fd9', '#3fae7a', '#9a4fd9', '#d94fb0', '#4fd9d0'];
    for (let r = 0; r < rows; r++) {
      const color = palette[r % palette.length];
      for (let cIdx = 0; cIdx < cols; cIdx++) {
        ctx.fillStyle = color;
        const pad = 3;
        ctx.fillRect(cIdx*cell+pad, r*cell+pad, cell-pad*2, cell-pad*2-4);
        // seat-back shading
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.fillRect(cIdx*cell+pad, r*cell+pad, cell-pad*2, 5);
      }
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }

  const startR = OUTFIELD_R + 6;
  const tiers = 26;
  const rowHeight = 0.9;
  const rowDepth = 1.05;

  // Profile of the bowl: starts low near the field, curves up and outward (amphitheater slope)
  const points = [];
  for (let t = 0; t <= tiers; t++) {
    const frac = t / tiers;
    const r = startR + t * rowDepth + frac*frac * 10; // gentle outward flare as it rises
    const y = 0.3 + t * rowHeight;
    points.push(new THREE.Vector2(r, y));
  }
  topR = points[points.length-1].x;
  topY = points[points.length-1].y;
  STADIUM_EDGE_R = topR - 4; // stop the ball a little before the literal back wall, i.e. right at the crowd
  STAND_START_R = startR;    // ball physics (groundHeightAt) now uses this to know where the solid seating begins
  STAND_PROFILE = points;    // ball physics (groundHeightAt) walks this to find the seating surface height at any radius

  const seatTex = makeSeatTexture();
  seatTex.repeat.set(90, tiers / 2);

  const bowlGeo = new THREE.LatheGeometry(points, 128);
  const bowlMat = new THREE.MeshStandardMaterial({
    map: seatTex, roughness: 0.85, metalness: 0,
    side: THREE.DoubleSide
  });
  const bowl = new THREE.Mesh(bowlGeo, bowlMat);
  bowl.receiveShadow = true;
  scene.add(bowl);

  // Back wall behind the top row (solid, so it doesn't look open to the sky)
  const backWallMat = new THREE.MeshStandardMaterial({ color: 0x2b2f38, roughness: 0.9 });
  const backWall = new THREE.Mesh(
    new THREE.CylinderGeometry(topR + 0.5, topR + 0.5, 3, 128, 1, true),
    backWallMat
  );
  backWall.position.y = topY + 1.3;
  scene.add(backWall);

  // Canopy roof ring, tilted outward for a classic stadium silhouette
  const roofMat = new THREE.MeshStandardMaterial({ color: 0x555b66, roughness: 0.6, metalness: 0.3, side: THREE.DoubleSide });
  const roofGeo = new THREE.RingGeometry(topR - 2, topR + 14, 128);
  const roof = new THREE.Mesh(roofGeo, roofMat);
  roof.rotation.x = Math.PI/2 + 0.18;
  roof.position.y = topY + 8;
  scene.add(roof);

  // Support struts under the roof, evenly spaced
  const strutMat = new THREE.MeshStandardMaterial({ color: 0x444a52 });
  const strutCount = 24;
  for (let i = 0; i < strutCount; i++) {
    const a = (i/strutCount) * Math.PI * 2;
    const strut = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 8, 6), strutMat);
    strut.position.set(Math.cos(a)*(topR+2), topY + 4, Math.sin(a)*(topR+2));
    strut.rotation.z = Math.cos(a) * 0.3;
    strut.rotation.x = -Math.sin(a) * 0.3;
    scene.add(strut);
  }
}

// ---------- Team dugout: a solid curved-roof shelter just outside the boundary ----------
{
  const dugoutDepth = OUTFIELD_R + 2.5;       // front face just outside the ad boards
  const dugoutHalfLen = 5.5;                  // half the bench's length, along Z
  const dugoutHalfDepth = 1.6;                // front-to-back depth of the shelter
  const dugoutCenterX = dugoutDepth + dugoutHalfDepth;
  DUGOUT_MIN_X = dugoutCenterX - dugoutHalfDepth;
  DUGOUT_MAX_X = dugoutCenterX + dugoutHalfDepth;
  DUGOUT_MIN_Z = -dugoutHalfLen;
  DUGOUT_MAX_Z = dugoutHalfLen;

  const dugout = new THREE.Group();

  // Low white base frame the bench + posts sit on
  const baseMat = new THREE.MeshStandardMaterial({ color: 0xf2f2f2, roughness: 0.5 });
  const base = new THREE.Mesh(new THREE.BoxGeometry(dugoutHalfDepth*2, 0.12, dugoutHalfLen*2), baseMat);
  base.position.set(dugoutCenterX, 0.06, 0);
  dugout.add(base);

  // Row of bench seats, evenly spaced along the length
  const seatMat = new THREE.MeshStandardMaterial({ color: 0x1f6fd6, roughness: 0.4 });
  const seatCount = 10;
  for (let i = 0; i < seatCount; i++) {
    const sz = -dugoutHalfLen + 0.5 + i * ((dugoutHalfLen*2 - 1) / (seatCount - 1));
    const seatPan = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.08, 0.6), seatMat);
    seatPan.position.set(dugoutCenterX - dugoutHalfDepth + 0.9, 0.55, sz);
    dugout.add(seatPan);
    const seatBack = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.55, 0.6), seatMat);
    seatBack.position.set(dugoutCenterX - dugoutHalfDepth + 0.58, 0.85, sz);
    dugout.add(seatBack);
    DUGOUT_SEAT_POSITIONS.push({ x: dugoutCenterX - dugoutHalfDepth + 0.9, y: 0.55, z: sz });
  }

  // Corner + intermediate posts holding the roof up, white like the frame
  const postMat = new THREE.MeshStandardMaterial({ color: 0xe8e8e8, roughness: 0.4, metalness: 0.1 });
  const postCount = 6;
  for (let i = 0; i < postCount; i++) {
    const sz = -dugoutHalfLen + i * (dugoutHalfLen*2 / (postCount - 1));
    [dugoutCenterX - dugoutHalfDepth + 0.15, dugoutCenterX + dugoutHalfDepth - 0.15].forEach((px) => {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.3, 8), postMat);
      post.position.set(px, 1.15, sz);
      dugout.add(post);
    });
  }

  // Curved roof: a barrel-vault arc spanning the shelter's full depth and length, semi-transparent like polycarbonate.
  const archRadius = dugoutHalfDepth;
  DUGOUT_ROOF_Y = 2.3 + archRadius;
  const roofGeo = new THREE.CylinderGeometry(archRadius, archRadius, dugoutHalfLen*2 + 0.4, 24, 1, true, -Math.PI/2, Math.PI);
  roofGeo.rotateX(-Math.PI/2);
  const roofMat = new THREE.MeshStandardMaterial({
    color: 0xdfeeff, roughness: 0.25, metalness: 0.05,
    transparent: true, opacity: 0.55, side: THREE.DoubleSide
  });
  const roof = new THREE.Mesh(roofGeo, roofMat);
  roof.position.set(dugoutCenterX, 2.3, 0);
  dugout.add(roof);

  // Solid back wall (the shelter's closed side, facing away from the field)
  const backWallMat = new THREE.MeshStandardMaterial({ color: 0xe8e8e8, roughness: 0.5, side: THREE.DoubleSide });
  const backWall = new THREE.Mesh(new THREE.PlaneGeometry(dugoutHalfLen*2, 2.3), backWallMat);
  backWall.position.set(dugoutCenterX + dugoutHalfDepth - 0.05, 1.15, 0);
  backWall.rotation.y = Math.PI/2;
  dugout.add(backWall);

  dugout.traverse((obj) => { if (obj.isMesh) obj.receiveShadow = true; });
  scene.add(dugout);
}

// Floodlight towers at 4 corners
{
  const towerR = topR + 18;
  [0.3, 1.3, -0.7, -1.7].forEach(mult => {
    const a = mult * Math.PI/2 + Math.PI/4;
    const pole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.4, 0.5, 34, 8),
      new THREE.MeshStandardMaterial({ color: 0x888888 })
    );
    pole.position.set(Math.cos(a)*towerR, 17, Math.sin(a)*towerR);
    pole.castShadow = true;
    scene.add(pole);
    const lightBank = new THREE.Mesh(
      new THREE.BoxGeometry(4, 3, 1),
      new THREE.MeshStandardMaterial({ color: 0xffffee, emissive: 0xffffcc, emissiveIntensity: 0.4 })
    );
    lightBank.position.set(Math.cos(a)*towerR, 34, Math.sin(a)*towerR);
    scene.add(lightBank);
  });
}

// ---------- Settings panel ----------
lookSensitivity = 1.0;
const settingsBtn = document.getElementById('settingsBtn');
const settingsPanel = document.getElementById('settingsPanel');
const backBtn = document.getElementById('backBtn');
const sensSlider = document.getElementById('sensSlider');
const sensValue = document.getElementById('sensValue');

function openSettings() {
  settingsPanel.classList.add('open');
  if (document.pointerLockElement) document.exitPointerLock();
}
function closeSettings() {
  settingsPanel.classList.remove('open');
}

// =====================================================================
// FBX TEST MODULE — isolated proof-of-concept for the Mixamo pipeline.
// Loads one real rigged/skinned character (X_Bot) + all 7 downloaded
// animation clips (Idle, Running, Golf Drive [batting-swing stand-in],
// Baseball Strike [batting-swing stand-in], Throw Object, Goalkeeper
// Catch, Goalkeeper Diving Save) from embedded base64 FBX data, places
// it on the outfield near the existing test billboard character, and
// runs a small looping "AI" that cycles through every clip with a
// crossfade so we can see each animation actually play on a real
// skeleton before any of this touches the striker/bowler/fielder code.
//
// Notes on script-tag safety and CDN loading are the same fix as
// before: this is plain JS inserted directly inside the page's single
// existing script block (no nested script tags, no literal closing-
// script-tag text anywhere in these comments), and the FBXLoader/fflate
// dependencies are loaded dynamically at runtime with a CDN fallback.
// =====================================================================

const FBX_TEST = { mixer: null, model: null, ready: false, actions: {}, currentAction: null };
// Raw parsed clips (post root-motion-strip), kept separately from FBX_TEST.actions
// so any number of extra character instances can build their own actions from
// the same clip data without re-parsing the animation FBX files again.
const FBX_TEST_CLIPS = {};

function _fbxLoadScript(url) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = url;
    s.crossOrigin = 'anonymous';
    s.onload = () => resolve(url);
    s.onerror = () => reject(new Error('failed to load: ' + url));
    document.head.appendChild(s);
  });
}

async function _fbxLoadFirstWorking(urls, label) {
  for (const url of urls) {
    try {
      await _fbxLoadScript(url);
      console.log('FBX test: loaded ' + label + ' from ' + url);
      return true;
    } catch (err) {
      console.warn('FBX test: ' + label + ' failed from ' + url + ' — trying next mirror if any.');
    }
  }
  return false;
}

// Animation assets now live as real files served alongside this page,
// instead of being embedded as base64 text. The browser fetches each one
// with FBXLoader.load() the first time it's needed.
const ANIM_BASE = './assets/animations/';
const ANIM_FILES = {
  xbot:                   ANIM_BASE + 'xbot.fbx',
  idle:                   ANIM_BASE + 'idle.fbx',
  running:                ANIM_BASE + 'running.fbx',
  golfDrive:              ANIM_BASE + 'golf_drive.fbx',
  baseballStrike:         ANIM_BASE + 'baseball_strike.fbx',
  throwObject:            ANIM_BASE + 'throw_object.fbx',
  goalkeeperCatch:        ANIM_BASE + 'goalkeeper_catch.fbx',
  goalkeeperDivingSave:   ANIM_BASE + 'goalkeeper_diving_save.fbx',
  baseballIdle:           ANIM_BASE + 'baseball_idle.fbx',
  goalkeeperCatch2:       ANIM_BASE + 'goalkeeper_catch2.fbx',
};

// Promise-wrapped loader.load() so existing async functions can just
// `await _fbxLoadUrl(loader, url)` where they used to do a synchronous
// `loader.parse(base64Bytes, '')`.
function _fbxLoadUrl(loader, url) {
  return new Promise((resolve, reject) => {
    loader.load(
      url,
      (obj) => resolve(obj),
      undefined, // onProgress — not needed
      (err) => reject(err)
    );
  });
}

// The X_Bot base mesh is reused for every duel character and every
// fielder. We fetch it from the network exactly once, then each spawn
// site below makes a SkeletonUtils.clone() of this template — a proper
// deep clone that preserves bone bindings (a plain Object3D.clone()
// would NOT work correctly for a skinned/animated mesh).
let _XBOT_TEMPLATE = null;
async function _preloadXbotTemplates(loader) {
  _XBOT_TEMPLATE = await _fbxLoadUrl(loader, ANIM_FILES.xbot);
}
function _cloneXbot() {
  return THREE.SkeletonUtils.clone(_XBOT_TEMPLATE);
}

// Every animation clip we downloaded, in the order the demo AI cycles
// through them. Each entry maps a friendly name to its base64 constant.

const FBX_TEST_CLIP_SOURCES = [
  { name: 'idle',                 url: ANIM_FILES.idle },
  { name: 'running',              url: ANIM_FILES.running },
  { name: 'golfDrive',            url: ANIM_FILES.golfDrive },
  { name: 'baseballStrike',       url: ANIM_FILES.baseballStrike },
  { name: 'throwObject',          url: ANIM_FILES.throwObject },
  { name: 'goalkeeperDivingSave', url: ANIM_FILES.goalkeeperDivingSave },
  { name: 'baseballIdle',         url: ANIM_FILES.baseballIdle },
  { name: 'goalkeeperCatch2',     url: ANIM_FILES.goalkeeperCatch2 },
];

async function runFBXTestCharacter() {
  if (typeof THREE.FBXLoader !== 'function') {
    console.error('FBX test: THREE.FBXLoader is still not available after loading scripts — aborting test character.');
    return;
  }

  const loader = new THREE.FBXLoader();

  // Fetch the shared X_Bot templates once, over the network, instead of
  // decoding them from an embedded base64 string. Every later spawn site
  // (duel characters, fielders) clones these templates instead of
  // re-fetching/re-parsing the file again.
  try {
    await _preloadXbotTemplates(loader);
  } catch (err) {
    console.error('FBX test: failed to load X_Bot mesh from assets/animations/', err);
    return;
  }

  const meshObj = _cloneXbot();

  // Mixamo FBX characters are authored in centimeters (~180 units tall);
  // scale to meters so it matches the ~1.9m-tall billboard characters
  // already standing on this same field.
  meshObj.scale.setScalar(0.01);

  // Stand it near the existing test billboard character (which spawns
  // around x=(-10..10), z=(20..30)) so it's easy to spot right on load.
  meshObj.position.set(8, 0, 12);

  meshObj.traverse((node) => {
    if (node.isMesh) {
      node.castShadow = true;
      node.receiveShadow = true;
    }
  });

  // Not added to the scene: this instance exists purely to hold the shared
  // AnimationMixer/clip data (parsed below into FBX_TEST_CLIPS) that the
  // bowler/striker duel characters build their own actions from — we no
  // longer field a third "fetch" character to chase/pick up/throw the ball.
  FBX_TEST.model = meshObj;
  FBX_TEST.mixer = new THREE.AnimationMixer(meshObj);

  // Parse every animation clip onto the same skeleton and build a
  // clipAction for each one, so the demo AI can crossfade between them.
  //
  // Mixamo clips like "running" have real forward motion baked into the
  // root bone's position track (the hips actually translate forward each
  // loop). Since our own AI code drives model.position separately, that
  // baked-in drift stacks on top of it and then snaps back to frame 0
  // every time the clip loops — the "slides forward, snaps back" glitch.
  // Fix: lock the root bone's horizontal (X/Z) position to its first-frame
  // value on every track, in every clip, so each clip plays perfectly in
  // place and our own code is the only thing moving the character through
  // the world. Vertical (Y) motion — the up/down bob of a run cycle — is
  // left untouched since that's part of the in-place animation, not travel.
  function stripHorizontalRootMotion(clip) {
    for (const track of clip.tracks) {
      if (!track.name.toLowerCase().endsWith('.position')) continue;
      if (!(track instanceof THREE.VectorKeyframeTrack)) continue;
      const values = track.values; // flat [x0,y0,z0, x1,y1,z1, ...]
      const x0 = values[0], z0 = values[2];
      for (let i = 0; i < values.length; i += 3) {
        values[i] = x0;     // lock X to the first frame
        values[i + 2] = z0; // lock Z to the first frame
        // values[i+1] (Y) left alone — vertical bob stays intact
      }
    }
  }

  let loadedCount = 0;
  for (const src of FBX_TEST_CLIP_SOURCES) {
    try {
      const animObj = await _fbxLoadUrl(loader, src.url);
      if (animObj.animations && animObj.animations.length) {
        const clip = animObj.animations[0];
        stripHorizontalRootMotion(clip);
        FBX_TEST_CLIPS[src.name] = clip;
        const action = FBX_TEST.mixer.clipAction(clip);
        action.clampWhenFinished = false;
        action.setLoop(THREE.LoopRepeat, Infinity);
        FBX_TEST.actions[src.name] = action;
        loadedCount++;
        console.log('FBX test: "' + src.name + '" clip — duration=' + clip.duration.toFixed(2) + 's, tracks=' + clip.tracks.length);
      } else {
        console.warn('FBX test: ' + src.name + ' FBX parsed but contained no animation clip.');
      }
    } catch (err) {
      console.error('FBX test: failed to parse animation "' + src.name + '"', err);
    }
  }

  console.log('FBX test: loaded ' + loadedCount + '/' + FBX_TEST_CLIP_SOURCES.length + ' animation clips.');

  FBX_TEST.ready = true;
  console.log('FBX test: clip data ready — spawning the bowler/striker duel characters.');

  initDuelCharacters(loader);
}

// ---- Shared ball geometry helper. Originally built for a third

// ball mesh for their delivery. ----
// =====================================================================
const BALL_RADIUS = 0.12; // matches a real cricket ball, in world units

function createFetchBall() {
  const ballGeo = new THREE.SphereGeometry(BALL_RADIUS, 32, 24);
  const ballMat = new THREE.MeshStandardMaterial({ color: 0xB01E1E, roughness: 0.45, metalness: 0.05 });
  const b = new THREE.Mesh(ballGeo, ballMat);
  b.castShadow = true;
  b.receiveShadow = true;

  // stitched seam — a thin torus wrapped around the ball, tilted like a real seam
  const seamGeo = new THREE.TorusGeometry(BALL_RADIUS * 1.01, BALL_RADIUS * 0.045, 8, 48);
  const seamMat = new THREE.MeshStandardMaterial({ color: 0xf2e6d8, roughness: 0.7 });
  const seam = new THREE.Mesh(seamGeo, seamMat);
  seam.rotation.x = Math.PI / 2.4;
  seam.rotation.y = 0.5;
  b.add(seam);

  return b;
}

// meets the ball. The hit-detection used to trigger right at
// STRIKER_END_Z — basically the stumps line — which is where a real
// batter's body stands, not where his bat meets the ball. A bat swings
// out in front of the body, so by the time the ball had already reached
// STRIKER_END_Z it had visually passed the bat's swing arc already,
// which is exactly the "ball already past the batsman, then gets hit
// out of thin air" bug being reported. Moving the contact trigger this

const BAT_GRIP_LOCAL_POS = new THREE.Vector3(0, 0, 0);
const BAT_GRIP_LOCAL_ROT = new THREE.Euler(0, 0, Math.PI / 2);

function createHitQualityLabel(quality, powerMult) {
  // Create 2D HTML label at top-right corner

  label.style.position = 'fixed';
  label.style.top = '12px';
  label.style.right = '60px';
  label.style.transform = 'none';
  label.style.fontSize = '14px';
  label.style.fontWeight = 'bold';
  label.style.fontFamily = 'Arial, sans-serif';
  label.style.zIndex = '9999';
  label.style.pointerEvents = 'none';
  label.style.textShadow = '2px 2px 4px rgba(0,0,0,1)';

  label.style.borderRadius = '6px';
  label.style.transition = 'opacity 0.3s ease-out';
  
  // Color and border based on quality
  let text = 'UNKNOWN';
  let powerText = '';
  
  if (quality === 'middle') {
    label.style.color = '#00FF00';  // green
    label.style.borderColor = '#00FF00';
    text = 'MIDDLE';
    powerText = ' (+80%)';
  } else if (quality === 'offcenter') {
    label.style.color = '#FFFF00';  // yellow
    label.style.borderColor = '#FFFF00';
    text = 'OFFCENTER';
    powerText = ' (normal)';
  } else if (quality === 'edge') {
    label.style.color = '#FF0000';  // red
    label.style.borderColor = '#FF0000';
    text = 'EDGE';
    powerText = ' (-65%)';
  }
  
  label.textContent = text + powerText;
  document.body.appendChild(label);
  
  // Auto-remove after 1.5 seconds with fade
  hitQualityLabels.push({
    element: label,
    timer: 0,
    duration: 1.5
  });
}

function updateHitLabels(dt) {
  for (let i = hitQualityLabels.length - 1; i >= 0; i--) {
    const label = hitQualityLabels[i];
    label.timer += dt;
    
    // Fade out
    const opacity = Math.max(0, 1 - (label.timer / label.duration));
    label.element.style.opacity = opacity;
    
    if (label.timer >= label.duration) {
      label.element.remove();
      hitQualityLabels.splice(i, 1);
    }
  }
}

const DUEL_HIT_WINDOW_FRAC = 0.08;      // +/- fraction of the swing clip's duration, centered on the impact frac, over which we keep sampling bat/ball distance each frame instead of just once — absorbs frame-rate jitter around the true contact instant
const DUEL_RESET_DELAY = 1.5;        // seconds after a delivery resolves before the next one starts
const DUEL_RESOLVED_WATCHDOG_TIMEOUT = 8; // fail-safe: max seconds to sit in 'resolved' waiting on the chase/pickup/throw/catch loop before forcing the next delivery anyway — covers a ball nobody ever reaches, a fielder stuck against something, or a return throw that never gets within pickup range of the bowler

const DUEL = {
  striker: null, ball: null,
  ballVel: new THREE.Vector3(),
  state: 'ready', stateTimer: 0,
  delivered: false, held: true,
  // swung: true only while the swing animation is actually playing. It
  // used to stay true for the rest of the whole delivery (all the way
  // through the ~1.5s "resolved" wait), which is why the striker's
  // shuffled/crouched tracking position sat frozen off his guard spot
  // that whole time and then hard-snapped back the instant the next
  // delivery reset — that's the "not being false right away" bug.
  // committedThisBall is the separate "has this ball's swing decision
  // already been made" gate, so a second swing can't retrigger once the
  // first one's done and swung has reset.
  swung: false, committedThisBall: false,
  swingTimer: 0, impactApplied: false, released: false,
  bowlTimer: null, // tracks the bowler's own throw-clip progress, independent of DUEL.state
  leftBall: false, // true once a delivery's predicted height is judged out of reach and he's decided not to swing at all
  afterHit: false, // true from the moment hitBall() fires until the next resetDelivery — gates the rolling-friction fix so it only touches the post-hit outfield roll, not the bowler's own pitch-bounce
  fielderReactionTimer: 0, // counts down from FIELDER_REACTION_DELAY once hitBall() fires — see updateFielderAI
  // ---- Pass 4/5/6: pickup + return throw + bowler collects. ----
  returning: false, // true once a fielder's return throw is airborne/rolling back toward the bowler — the ball is no longer "held" by anyone, it's a free projectile again, same as the original hit
  returnComplete: false, // set true the instant the bowler collects the returned ball — gates DUEL_RESET_DELAY in the 'resolved' branch so the next delivery can't start until the whole chase/throw/collect loop has actually finished
  ballHeldByFielder: false, // true from the moment a fielder 'arrived's at the ball through the throw wind-up (pre-release) — blocks the main ball-physics block below so the ball doesn't keep falling/rolling on its own while someone's supposedly holding it
  // fielderClaim: the id of the ONE fielder allowed to handle the current
  // ball past 'chasing' — set the instant a fielder arrives (Pass 4) and
  // cleared by resetDelivery. Multiple fielders can still race toward the
  // ball while it's in the air (that's fine, matches the reference AI),
  // but only the first to actually arrive is allowed to pick it up/throw
  // it; everyone else stands down. This is the fix for the bug where two
  // fielders both "arrived" on the same ball and each ran their own
  // pickup->throw->catch sequence — a straggler's late catch could land
  // after the game had already reset and moved on to the next delivery,
  // permanently corrupting returnComplete and gluing every future ball to
  // the bowler's hands (see updateCaughtBallHold).
  fielderClaim: null,
  // ---- Deterministic return-throw flight (see updateFielderAI's release
  // pass + updateReturnThrow) — replaces the old free-projectile physics
  // for the fielder-to-bowler throw so it always actually arrives.
  returnThrowStart: null, returnThrowTarget: null,
  returnThrowDuration: 0, returnThrowElapsed: 0,
  // Where the shuffle/crouch tracking currently wants the striker's root —
  // eased toward every frame (see the bottom of the 'inFlight' branch) so
  // he glides back to his guard spot as soon as the swing/leave is done,
  // instead of staying stuck in the offset pose until the hard reset.
  shuffleTargetX: STRIKER_END_X, shuffleTargetY: 0,
};

// ---- Fielders: same base character, spawned at fixed home positions
// around the outfield. Starting with just 3 (mirrors the reference 2D
// fielder AI's own starting set) — chase/catch/throw AI comes in later
// passes, one at a time, on top of this. Positions are within
// OUTFIELD_R/BOUNDARY_R (70/68) so nobody's already standing in the stands.
const FIELDER_SPAWN_SPOTS = [
  { id: 'fielder_cover',     role: 'cover',      x: 40,  z: 15  },
  { id: 'fielder_midwicket', role: 'mid-wicket', x: -38, z: 20  },
  { id: 'fielder_point',     role: 'point',      x: 32,  z: -28 },
];
let FIELDERS = []; // populated by initDuelCharacters -> spawnFielder, one entry per spot above

// ---- Pass 2/3: reaction + chase. Local boundary radius since OUTFIELD_R/
// BOUNDARY_R (used for the visible grass/rope) are scoped inside the setup
// try-block above and aren't reachable down here — this is the same 68m
// rope distance, just re-declared where the chase logic can see it.
const FIELDER_BOUNDARY_R      = 66;   // never chase past this — clamp their run target just inside the rope
const FIELDER_REACTION_RADIUS = 38;   // how far from the ball a 'base' fielder will notice it and start chasing
const FIELDER_REACTION_DELAY  = 0.35; // seconds after the hit before anyone reacts — a beat, not instant
const FIELDER_CHASE_SPEED     = 9.5;  // m/s sprint speed while chasing
const FIELDER_CHASE_ARRIVE_DIST = 1.0; // how close counts as "reached the ball"

// ---- Pass 4/5/6: pickup, return throw, bowler collects. Reuses the same
// throwObject clip the bowler bowls with (it's the only throw-style clip
// loaded) — a fielder's "gather the ball" beat is just a short pause on
// 'idle' before that clip plays, not a separate animation.
const FIELDER_PICKUP_DELAY      = 0.3;  // seconds spent "gathering" the ball once arrived, before the throw animation starts
const FIELDER_THROW_RELEASE_FRAC = 0.5; // fraction through throwObject when the ball actually leaves the hand — mirrors DUEL_RELEASE_FRAC for the bowler's own delivery
const FIELDER_THROW_PACE        = 20;   // m/s horizontal speed of the return throw — brisker than a chase, slower than a full bowling delivery
const BOWLER_CATCH_DIST         = 1.4;  // how close the returned ball must get to the bowler (x/z) to count as collected
const BOWLER_CATCH_HEIGHT       = 2.3;  // max ball height the bowler can pluck out of the air — above this it just sails past and has to come down/roll in first


// data, with its own AnimationMixer and its own set of actions built from
// the shared FBX_TEST_CLIPS (the clip resource can be reused across many
// mixers — only the per-character AnimationAction needs to be separate).
function spawnDuelCharacter(loader, x, z, yaw) {
  let model = null;
  try {
    model = _cloneXbot();
  } catch (err) {
    console.error('Duel test: failed to clone an extra X_Bot instance', err);
    return null;
  }
  model.scale.setScalar(MODEL_SCALE);
  model.position.set(x, 0, z);
  model.rotation.y = yaw;
  model.traverse((node) => {
    if (node.isMesh) { node.castShadow = true; node.receiveShadow = true; }
  });
  scene.add(model);

  const mixer = new THREE.AnimationMixer(model);
  const actions = {};
  for (const name in FBX_TEST_CLIPS) {
    const action = mixer.clipAction(FBX_TEST_CLIPS[name]);
    action.clampWhenFinished = false;
    action.setLoop(THREE.LoopRepeat, Infinity);
    actions[name] = action;
  }

  // Add procedural walk animation
  {
    const bones = {};
    model.traverse((node) => {
      if (node.isBone) bones[node.name] = node;
    });
    
    function findBone(patterns) {
      if (!Array.isArray(patterns)) patterns = [patterns];
      for (const name in bones) {
        const nameLower = name.toLowerCase();
        for (const pat of patterns) {
          if (nameLower.includes(pat.toLowerCase())) return bones[name];
        }
      }
      return null;
    }
    
    const tracks = [];
    const leftLeg = findBone(['leftleg', 'left_leg', 'legup_l', 'l_leg']);
    const rightLeg = findBone(['rightleg', 'right_leg', 'legup_r', 'r_leg']);
    
    if (leftLeg) {
      tracks.push(new THREE.QuaternionKeyframeTrack(
        leftLeg.name + '.quaternion',
        [0, 0.5, 1, 1.5, 2],
        [0,0,0,1, 0.2,0,0,0.98, 0,0,0.15,1, -0.2,0,0,0.98, 0,0,0,1]
      ));
    }
    if (rightLeg) {
      tracks.push(new THREE.QuaternionKeyframeTrack(
        rightLeg.name + '.quaternion',
        [0, 0.5, 1, 1.5, 2],
        [-0.2,0,0,0.98, 0,0,-0.15,1, 0.2,0,0,0.98, 0,0,0.15,1, -0.2,0,0,0.98]
      ));
    }
    
    if (tracks.length > 0) {
      const walkClip = new THREE.AnimationClip('walk', 2, tracks);
      const walkAction = mixer.clipAction(walkClip);
      walkAction.clampWhenFinished = false;
      walkAction.setLoop(THREE.LoopRepeat, Infinity);
      actions['walk'] = walkAction;
    }
  }

  return { model, mixer, actions, currentAction: null };

function createProceduralAnimationsForCharacter(character, mixer) {
  const bones = {};
  const clips = {};
  
  character.traverse((node) => {
    if (node.isBone) {
      bones[node.name] = node;
    }
  });
  
  // Helper to find bone by pattern
  function findBone(patterns) {
    if (!Array.isArray(patterns)) patterns = [patterns];
    for (const name in bones) {
      const nameLower = name.toLowerCase();
      for (const pat of patterns) {
        if (nameLower.includes(pat.toLowerCase())) return bones[name];
      }
    }
    return null;
  }
  
  // IDLE animation
  {
    const tracks = [];
    const spine = findBone(['spine', 'chest', 'armature']);
    if (spine) {

        spine.name + '.quaternion',
        [0, 1, 2, 3],
